name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      #- name: Upload APK
        #uses: actions/upload-artifact@v4
        #with:
          #name: app-release
          #path: build/app/outputs/flutter-apk/app-release.apk
          #retention-days: 7

          # ADD THIS INSTEAD
      - name: Upload APK to transfer.sh
        run: |
          # 1. Capture the link in a variable
          DOWNLOAD_URL=$(curl --upload-file ./app/build/outputs/apk/debug/app-debug.apk https://transfer.sh)
    
          # 2. Print it clearly in the logs
          echo "================================================"
          echo "BUILD SUCCESSFUL!"
          echo "DOWNLOAD LINK: $DOWNLOAD_URL"
          echo "================================================"
