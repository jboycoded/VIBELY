name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      #- name: Upload APK
        #uses: actions/upload-artifact@v4
        #with:
          #name: app-release
          #path: build/app/outputs/flutter-apk/app-release.apk
          #retention-days: 7

      - name: Upload APK to transfer.sh
        run: |
          # 1. Update this path based on your build type (debug or release)
          # Common path: build/app/outputs/flutter-apk/app-release.apk
          APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK was found in the Flutter build folder!"
            exit 1
          fi
          echo "Uploading file from: $APK_PATH"
          # 2. Upload and display link
          DOWNLOAD_URL=$(curl --upload-file "$APK_PATH" https://transfer.sh)
          echo "================================================"
          echo "DOWNLOAD LINK: $DOWNLOAD_URL"
          echo "================================================"
