name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      #- name: Upload APK
        #uses: actions/upload-artifact@v4
        #with:
          #name: app-release
          #path: build/app/outputs/flutter-apk/app-release.apk
          #retention-days: 7

      - name: Upload APK to transfer.sh
        run: |
           # The standard Flutter release path
           APK_PATH="./build/app/outputs/flutter-apk/app-release.apk"
           echo "Uploading to bashupload.com (Backup)..."
           # bashupload gives a clean link in the response
           URL2=$(curl https://bashupload.com -T $APK_PATH)
           echo "================================================"
           echo "BUILD SUCCESSFUL!"
           echo "BACKUP LINK: $URL2"
           echo "================================================"
           
